name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x android_analog_clock/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android_analog_clock
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnalogClock-Android-APK
          path: android_analog_clock/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
